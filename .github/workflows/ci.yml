name: CI

on:
  push:
    branches: [ main, 'feature/**', 'ci-demo' ]
  pull_request:
    branches: [ main ]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Отримати код
        uses: actions/checkout@v4

      - name: Установити .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Відновити залежності
        run: dotnet restore

      - name: Перевірка форматування
        run: dotnet format --verify-no-changes --no-restore

      - name: Складання Release без попереджень
        run: dotnet build -c Release --no-restore -warnaserror

      - name: Тести
        run: dotnet test -c Release --no-build --collect:"XPlat Code Coverage" --settings coverlet.runsettings --results-directory ./TestResults

      - name: Поріг покриття 70 %
        shell: bash
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          export PATH="$PATH:$HOME/.dotnet/tools"
          reportgenerator "-reports:TestResults/**/coverage.cobertura.xml" "-targetdir:coverage" "-reporttypes:TextSummary;Cobertura"
          cat coverage/Summary.txt
          LINE=$(grep -oP 'Line coverage: \K[0-9.]+' coverage/Summary.txt)
          echo "Рядкове покриття: $LINE %"
          awk -v v="$LINE" 'BEGIN { exit (v >= 70) ? 0 : 1 }'

      - name: Зберегти звіт про покриття
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
